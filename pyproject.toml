[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libra-tts"
version = "0.1.0"
description = "Libra TTS: fast multilingual text to speech (16 languages, 8 voices)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "tokenizers>=0.20",
  "soundfile>=0.12",
  "huggingface_hub>=0.24",
  "mlx>=0.29; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]
cuda = ["torch>=2.5", "safetensors>=0.4"]
ja = ["pyopenjtalk>=0.4; sys_platform != 'win32'", "pyopenjtalk-plus>=0.4.1; sys_platform == 'win32'"]

[project.scripts]
libra-tts = "libra_tts.cli:main"

[tool.setuptools]
packages = ["libra_tts"]
